<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <circle cx="256" cy="256" r="210" fill="url(#bgGradient)" stroke="#2563eb" stroke-width="4" stroke-opacity="0.3"/>
  <defs>
    <linearGradient id="bgGradient" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="100" y="100" width="312" height="312" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Glow Effect -->
  <g filter="url(#glow)">
    <!-- Vertical Bar -->
    <rect x="220" y="116" width="72" height="280" rx="20" fill="url(#crossGrad)" />
    <!-- Horizontal Bar -->
    <rect x="116" y="220" width="280" height="72" rx="20" fill="url(#crossGrad)" />
    <!-- Center Jewel Circle -->
    <circle cx="256" cy="256" r="32" fill="#ffffff" />
    <circle cx="256" cy="256" r="18" fill="#1d4ed8" />
  </g>
</svg>
